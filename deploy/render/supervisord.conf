; ─────────────────────────────────────────────────────────────────────────────
; PoliticOS — supervisord para el contenedor de Render
; Corre php-fpm, nginx y el worker de cola en primer plano; si uno muere,
; supervisord lo reinicia. QUEUE_CONNECTION=database (tabla `jobs`, sin Redis).
; ─────────────────────────────────────────────────────────────────────────────

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Procesa ProcessKnowledgeDocumentJob (MAP+REDUCE+embeddings de PDFs grandes:
; minutos, no segundos — por eso ya no corre inline con QUEUE_CONNECTION=sync).
; --max-time reinicia el proceso cada hora (libera memoria); autorestart lo
; vuelve a levantar si muere por --tries agotados o timeout de un job.
[program:queue-worker]
command=php artisan queue:work --queue=default --tries=3 --max-time=3600 --sleep=3
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
