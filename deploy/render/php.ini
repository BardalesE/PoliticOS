; PoliticOS — overrides de PHP para el contenedor de Render (demo)
; upload_max_filesize/post_max_size deben ser >= al límite real de video que
; validan los controllers (500MB, ver HeroSettingController/DistrictController)
; — antes estaban en 20M/25M, muy por debajo, y los uploads de video fallaban
; en silencio (nginx/php cortaban la petición antes de llegar a Laravel).
memory_limit = 512M
upload_max_filesize = 512M
post_max_size = 520M
max_execution_time = 300

; SSE: no comprimir ni bufferizar la salida a nivel PHP
output_buffering = Off
zlib.output_compression = Off

; OPcache (producción)
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

expose_php = Off
